<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Stress Test</title>
  <script>
    window.onload = function() {
      // Предотвращаем закрытие страницы
      window.onbeforeunload = function() {
        return "Ты точно хочешь уйти?";
      };

      // Максимальная нагрузка на процессор
      setTimeout(() => {
        while (true) {
          // Заполняем массив случайными числами бесконечно
          let arr = [];
          for (let i = 0; i < 10000; i++) {
            arr.push(Math.random());
          }
          console.log("⚙️ Нагрузка продолжается...");
        }
      }, 1000); // Через 1 секунду после загрузки
    };
  </script>
</head>
<body>
  <h1>Телефон под нагрузкой</h1>
  <p>Эта страница специально создана для нагрузки. Закрыть её будет непросто.</p>
</body>
</html>

    <button onclick="startTest()">Начать тест</button>
</body>
</html>
